<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hokie Houses & Apartments</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Hokie Houses & Apartments</h1>
                <p class="tagline">Find your perfect home in Blacksburg</p>
            </div>
        </header>
        
        <main>
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search for apartments, houses, or locations...">
                    <button id="search-button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="search-filters">
                    <button class="filter-btn">Price <i class="fas fa-chevron-down"></i></button>
                    <button class="filter-btn">Bedrooms <i class="fas fa-chevron-down"></i></button>
                    <button class="filter-btn">Distance to Campus <i class="fas fa-chevron-down"></i></button>
                    <button class="filter-btn">More Filters <i class="fas fa-sliders"></i></button>
                </div>
            </div>
            
            <div class="featured-section">
                <h2>Featured Properties</h2>
                <div class="featured-placeholder">
                    <p>Connect your agent to display featured properties here</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 Hokie Houses & Apartments | <a href="#">About</a> | <a href="#">Contact</a></p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
    <script src="js/main.js"></script>
</body>
</html>
